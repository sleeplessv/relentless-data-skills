name: Dossier browser tests

# The dossier render check's browser tests need Playwright and Chromium, so they
# run here, apart from the install-free tests in ci.yml, and only when the
# dossier skill or its tests change. Not a required check: the gallery loads its
# libraries from public CDNs, so an outage there can fail it.

on:
  pull_request:
    paths:
      - "skills/dossier/**"
      - "tests/test_dossier*.py"
      - "scripts/check.sh"
      - ".github/workflows/browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - name: Install Chromium's system libraries
        run: uv run --python 3.13 --no-project --with playwright playwright install-deps chromium
      - name: Run the checks with the browser tests
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The version baseline is ci.yml's: the base tip (HEAD^1) for a PR into
        # the default branch, the merge base with it for a PR into another branch.
        run: |
          baseline=$(git rev-parse HEAD^1)
          if [ -n "$PR_BASE_REF" ] && [ "$PR_BASE_REF" != "$DEFAULT_BRANCH" ]; then
            git rev-parse -q --verify "origin/$DEFAULT_BRANCH" >/dev/null ||
              git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            baseline=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
          fi
          scripts/check.sh --fast --browser --base "$baseline"
