name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC — catch upstream doc moves over time
  workflow_dispatch:

# Jobs read the repo and nothing else; a job that needs more asks for it.
permissions:
  contents: read

# A newer push to the same PR or branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA, with the release tag beside it;
# .github/dependabot.yml keeps the pins current.
#
# Every job but `tests` is light (stdlib Python, one npm install), so each
# runs on ubuntu-slim: a 1-vCPU container runner that starts faster and bills
# less than ubuntu-latest. Slim jobs are capped at 15 minutes.

jobs:
  skill-version-check:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check skill versions and generated registry
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A PR into the default branch compares with its base tip (HEAD^1).
          # A PR into another branch, such as an integration branch, compares
          # with the merge base of the merge result and the default branch, as
          # scripts/check.sh does: a skill that is new there keeps its launch
          # version until the branch merges.
          case "$EVENT_NAME" in
            pull_request)
              if [ "$PR_BASE_REF" = "$DEFAULT_BRANCH" ]; then
                baseline=$(git rev-parse HEAD^1)
              else
                git rev-parse -q --verify "origin/$DEFAULT_BRANCH" >/dev/null ||
                  git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
                baseline=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
              fi ;;
            push) baseline="$PUSH_BASE" ;;
            *) baseline="$GITHUB_SHA" ;;
          esac
          python scripts/skill_versions.py --check --base "$baseline"
          python scripts/sync_registry.py --check

  tests:
    # The suite outgrew the slim runner: 8 to 9 minutes of its 10, with more
    # tests on the way. ubuntu-latest has more cores and no 15-minute cap.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # 3.13 = the repo floor (CODING_STANDARDS.md PY1). The tests are
        # stdlib-only, so no installs.
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  skill-lint:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Lint SKILL.md files
        run: python scripts/lint_skill.py

  # The rule gate (#407): a PR into the default branch that changes skills/deliver/
  # carries the evidence its ## Change kind block declares. The script says when it
  # does not apply. It reads the body from this run's event payload, so a body edited
  # after the push is read on the next push: pull_request does not fire on `edited`
  # here, because an edit would cancel and rerun every job of the PR.
  gate-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's merge commit and its first parent, the base branch's tip.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check the change kind block
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.md"
          git diff -z --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          # The base's copy judges the PR, so a PR cannot loosen the gate that judges it.
          # A base without the script (before the gate lands) runs the PR's copy.
          git show HEAD^1:scripts/gate_check.py > "$RUNNER_TEMP/gate_check.py" 2>/dev/null \
            || cp scripts/gate_check.py "$RUNNER_TEMP/gate_check.py"
          python "$RUNNER_TEMP/gate_check.py" --body "$RUNNER_TEMP/body.md" --base "$BASE_REF" \
            --default-branch "$DEFAULT_BRANCH" --base-rev HEAD^1 --changed "$RUNNER_TEMP/changed"

  # The generated-registry check runs in skill-version-check, the check the
  # main ruleset requires, so it is not duplicated in a separate job.

  plugin-validate:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      # Pinned so a CLI release cannot change the verdict unannounced; bump it
      # by hand (Dependabot does not see global npm installs).
      CLAUDE_CODE_VERSION: "2.1.330"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

  doc-url-liveness:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check skill doc URLs
        run: python scripts/check_doc_urls.py
