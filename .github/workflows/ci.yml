name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC — catch upstream doc moves over time
  workflow_dispatch:

jobs:
  snowman-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 = oldest interpreter likely on a user machine (macOS system
        # python); 3.13 = current. The script is stdlib-only, so no installs.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run snowman tests
        run: python -m unittest discover -s tests -v

  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint SKILL.md files
        run: python scripts/lint_skill.py

  doc-url-liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check skill doc URLs
        run: python scripts/check_doc_urls.py
