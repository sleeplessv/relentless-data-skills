name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC — catch upstream doc moves over time
  workflow_dispatch:

jobs:
  skill-version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check skill versions and generated registry
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) baseline=$(git rev-parse HEAD^1) ;;
            push) baseline="$PUSH_BASE" ;;
            *) baseline="$GITHUB_SHA" ;;
          esac
          python scripts/skill_versions.py --check --base "$baseline"
          python scripts/sync_registry.py --check

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 = oldest interpreter likely on a user machine (macOS system
        # python); 3.13 = current. The tests are stdlib-only, so no installs.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint SKILL.md files
        run: python scripts/lint_skill.py

  # The generated-registry check runs in skill-version-check, the check the
  # main ruleset requires, so it is not duplicated in a separate job.

  plugin-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

  doc-url-liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check skill doc URLs
        run: python scripts/check_doc_urls.py
