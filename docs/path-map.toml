# The path map: for each generation-two path, the files it loads and its word limit.
# No run loads this file. scripts/word_count.py counts each row, and scripts/check.sh runs it.
#
# Each [[path]] row has:
#   name   the path
#   files  the files the path loads, from the repo root. Scripts are not counted.
#   limit  the most words those files may hold together. A row without it has no limit yet:
#          the lint prints its count and does not refuse it.
#
# A limit is the path's launch size plus 10%. Raising one takes the owner's own PR, stating why.

[[path]]
name = "small edit"
files = [
  "skills/deliver/SKILL.md",
  "skills/deliver/agents/deliver-reader.md",
]
limit = 534

[[path]]
name = "small edit on Cortex Code"
files = [
  "skills/deliver/SKILL.md",
  "skills/deliver/adapters/cortex.md",
]
limit = 714

[[path]]
name = "small edit on Codex"
files = [
  "skills/deliver/SKILL.md",
  "skills/deliver/adapters/codex.md",
]
limit = 670

[[path]]
name = "small edit on Cursor"
files = [
  "skills/deliver/SKILL.md",
  "skills/deliver/adapters/cursor.md",
]
limit = 674

[[path]]
name = "small edit on Antigravity"
files = [
  "skills/deliver/SKILL.md",
  "skills/deliver/adapters/antigravity.md",
]
limit = 676

# The single-ticket rows count deliver's own files. A review also loads the router skill and the two
# review skills, code-review and ponytail-review. Their size is not deliver's to choose, so no row counts them.

[[path]]
