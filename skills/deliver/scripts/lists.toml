# Hooks on the shell tool that preflight knows: #178 rule 38, as reading 8 of spec #407 sets it.
# `script` is the end of the hook command's path inside the named plugin.
known_hooks = [
  { name = "deliver guard", plugin = "deliver", script = "scripts/guard.py" },
  { name = "snowman guard", plugin = "snowman", script = "hooks/snow_guard.py" },
]
